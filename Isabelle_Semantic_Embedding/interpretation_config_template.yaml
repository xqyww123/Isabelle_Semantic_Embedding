# Configuration for the semantic-interpretation agent backends.
#
# This file is seeded from a template on first use and never touched again, so a
# key added to a later template will NOT appear here.  Edit it freely.
#
# It exists because some backends report only token counts, not money, and the
# per-theory cost recorded in the semantic database is in dollars.  A backend
# whose reported dollars are correct for the endpoint it actually talked to
# needs no entry here; the Claude Code CLI's figure is correct only against
# Anthropic's own API (ClaudeCode: no entry needed; DeepSeek: priced below).
#
# Prices are in dollars PER TOKEN:
#
#   input:         a token sent and not served from the prompt cache
#   cached_input:  a token sent and served from the prompt cache
#   output:        a token generated (this INCLUDES reasoning tokens, which the
#                  provider bills as output and reports inside the output count)
#
# A model used by a backend that needs prices, but missing from this file, is a
# hard error naming the model and this path -- reporting a run as free is worse
# than refusing to start it.
#
# ---------------------------------------------------------------------------
# WHAT THE RECORDED DOLLARS MEAN FOR CODEX.  Read this before trusting them.
#
# Signed in with a ChatGPT plan -- which is the reason this backend exists --
# Codex usage is NOT billed in dollars at all.  It draws on a plan quota metered
# in credits over a five-hour window, and money changes hands only if you buy
# extra credits.  The figure computed from the prices below is therefore the API
# list-price EQUIVALENT of the tokens consumed: the right number for comparing
# one backend against another, and not a bill.  Signed in with an API key, the
# same figure IS the bill, at these rates.
#
# Two known under-counts, both accepted:
#
#   * Cache WRITES.  The GPT-5.6 family charges a fourth rate for them (1.25x
#     the uncached input rate; earlier families charge nothing).  The Codex SDK's
#     usage report has no cache-write field at all -- input, cached input,
#     output, reasoning output, total -- so this cost cannot be computed from
#     what we are given, at any price we could write here.
#   * Requests over 272K input tokens are billed at 2x input and 1.5x output for
#     the whole request.  Not modelled; the batches this pipeline sends are far
#     smaller, and a compaction lands well before that ceiling.
#
# ---------------------------------------------------------------------------
# The prices below were read on 2026-07-27 from
# https://developers.openai.com/api/docs/pricing (standard tier, short context),
# and cross-checked against each model's own page.  The page carries no "as of"
# date; list prices change.  Check them before trusting a dollar figure.
#
# gpt-5.3-codex-spark is deliberately absent: it is available only to ChatGPT Pro
# subscribers and has no published per-token price.  Substituting a similar
# model's price would produce a plausible, wrong number.

models:
  # The Codex default (docs: "the default Power setting, which uses
  # gpt-5.6-sol"; priority 1 in the model catalogue).
  gpt-5.6-sol:
    pricing:
      input: 5.0e-6          # $5.00 / 1M
      cached_input: 5.0e-7   # $0.50 / 1M
      output: 3.0e-5         # $30.00 / 1M

  gpt-5.6-terra:
    pricing:
      input: 2.5e-6          # $2.50 / 1M
      cached_input: 2.5e-7   # $0.25 / 1M
      output: 1.5e-5         # $15.00 / 1M

  gpt-5.6-luna:
    pricing:
      input: 1.0e-6          # $1.00 / 1M
      cached_input: 1.0e-7   # $0.10 / 1M
      output: 6.0e-6         # $6.00 / 1M

  gpt-5.5:
    pricing:
      input: 5.0e-6          # $5.00 / 1M
      cached_input: 5.0e-7   # $0.50 / 1M
      output: 3.0e-5         # $30.00 / 1M

  gpt-5.4:
    pricing:
      input: 2.5e-6          # $2.50 / 1M
      cached_input: 2.5e-7   # $0.25 / 1M
      output: 1.5e-5         # $15.00 / 1M

  gpt-5.4-mini:
    pricing:
      input: 7.5e-7          # $0.75 / 1M
      cached_input: 7.5e-8   # $0.075 / 1M
      output: 4.5e-6         # $4.50 / 1M

  # ---------------------------------------------------------------------
  # WHAT THE RECORDED DOLLARS MEAN FOR DEEPSEEK (the "DeepSeek" driver: the
  # Claude Code CLI on DeepSeek's Anthropic-compatible endpoint).  These are
  # the PEAK list rates, read 2026-08-27 from
  # https://api-docs.deepseek.com/quick_start/pricing -- DeepSeek halves
  # them in off-peak windows, so the recorded dollars are an UPPER BOUND of
  # the bill (owner ruling: static peak, no time-of-day logic).  The CLI's
  # own dollar figure is ignored for this backend (it prices at Anthropic
  # rates -- measured 4.8x above ours on a cache-heavy turn and ~100x on a
  # cache-miss-dominated one).  AoA keeps an independent DeepSeek price
  # table: contrib/Isa-Mini/IsaMini/AoA/language_model_driver.py -- update
  # both when prices move.
  # deepseek-v4-flash-vision-exp is deliberately absent, from here and from
  # the driver's context-window table alike: unpriced until someone needs
  # it, so a run on it fails loudly instead of free.
  deepseek-v4-pro:
    pricing:
      input: 1.32e-6         # $1.32 / 1M (cache miss, peak)
      cached_input: 4.4e-8   # $0.044 / 1M (cache hit, peak)
      output: 3.96e-6        # $3.96 / 1M (peak)

  deepseek-v4-flash:
    pricing:
      input: 4.4e-7          # $0.44 / 1M (cache miss, peak)
      cached_input: 1.4e-8   # $0.014 / 1M (cache hit, peak)
      output: 1.32e-6        # $1.32 / 1M (peak)
