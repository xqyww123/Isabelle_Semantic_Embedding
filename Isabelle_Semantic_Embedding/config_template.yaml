# Isabelle_Semantic_Embedding — user configuration.
#
# Seeded here on first use from the template bundled in the package.  Every key
# is optional: what is not set here falls back to a default written in code.
# Environment variables win over this file.
#
# The semantic database is layered: a read-only system DB (the
# `isabelle-semantic-data` conda package, or a copy installed manually with
# `isabelle-semantics pull`) under your writable user DB.  Nothing syncs on
# its own; installing or updating the system DB is always an explicit act.
#
# NO SECRETS HERE.  Reading the conda channel needs no credentials at all.
#
# (A stale `r2:` section from an older version is ignored by the loader.)
